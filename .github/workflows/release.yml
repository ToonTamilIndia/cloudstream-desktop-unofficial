name: Build and Release (Windows MSI/EXE + Linux deb/rpm/AppImage/Flatpak)

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v0.0.1-beta, v1.0.0

permissions:
  contents: write

jobs:
  release_windows:
    name: Windows (MSI + EXE)
    runs-on: windows-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Download and inject libmpv-2.dll
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "desktop-app/appResources/windows/mpv"
        $headers = @{ "User-Agent" = "CloudStream-Desktop-CI" }
        $rel = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
        $asset = $rel.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" -and $_.name -notlike "*x86_64-v3*" } | Select-Object -First 1
        if (-not $asset) { throw "No mpv-dev-x86_64 asset found in release $($rel.tag_name)" }
        Write-Host "Downloading $($asset.name) ..."
        Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile "mpv-dev.7z"
        7z e mpv-dev.7z "libmpv-2.dll" -o"desktop-app/appResources/windows/mpv" -r

    - name: Build MSI + single-file EXE (jpackage)
      shell: pwsh
      run: |
        # packageReleaseMsi  -> CloudStream-Desktop.msi
        # packageReleaseExe  -> single self-contained CloudStream-Desktop.exe
        #                       (jpackage --type exe bundles a JRE: no Java install needed)
        ./gradlew desktop-app:packageReleaseMsi desktop-app:packageReleaseExe

    - name: Upload Windows MSI
      uses: actions/upload-artifact@v4
      with:
        name: windows-msi
        path: desktop-app/build/compose/binaries/main-release/msi/*.msi
        if-no-files-found: error

    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: desktop-app/build/compose/binaries/main-release/exe/*.exe
        if-no-files-found: error

  release_linux:
    name: Linux (deb / rpm / AppImage / Flatpak)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # jpackage Linux targets need rpmbuild (.rpm) and fpm/dpkg-deb (.deb)
    - name: Install packaging tooling (rpmbuild + fpm)
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm ruby ruby-dev build-essential
        sudo gem install fpm --no-document

    - name: Build Linux packages (jpackage)
      run: |
        ./gradlew desktop-app:packageReleaseAppImage
        ./gradlew desktop-app:packageReleaseRpm
        ./gradlew desktop-app:packageReleaseDeb

    - name: Build Flatpak (best-effort)
      continue-on-error: true
      run: |
        sudo apt-get install -y flatpak flatpak-builder
        # Stage the jpackage app-image into the flatpak source layout
        mkdir -p flatpak/app
        cp -r desktop-app/build/compose/binaries/main-release/app/CloudStream-Desktop flatpak/app/CloudStream-Desktop
        flatpak remote-add --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo
        flatpak install -y --noninteractive flathub org.freedesktop.Sdk//23.08 org.freedesktop.Platform//23.08
        flatpak-builder --force-clean --repo=build/flatpak-repo build/flatpak flatpak-manifest.json
        flatpak build-bundle build/flatpak-repo build/flatpak/CloudStream-Desktop-0.0.1-beta.flatpak com.github.ToonTamilIndia.CloudStreamDesktop stable
        echo "FLATPAK_BUILT=1" >> "$GITHUB_ENV"

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-packages
        path: |
          desktop-app/build/compose/binaries/main-release/**/*.AppImage
          desktop-app/build/compose/binaries/main-release/**/*.rpm
          desktop-app/build/compose/binaries/main-release/**/*.deb
          build/flatpak/*.flatpak
        if-no-files-found: warn

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [release_windows, release_linux]

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/windows-msi/*.msi
          artifacts/windows-exe/*.exe
          artifacts/linux-packages/**/*.AppImage
          artifacts/linux-packages/**/*.rpm
          artifacts/linux-packages/**/*.deb
          artifacts/linux-packages/**/*.flatpak
        generate_release_notes: true
        make_latest: true