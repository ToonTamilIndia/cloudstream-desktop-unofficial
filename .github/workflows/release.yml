name: Build and Release (Windows MSI/EXE + Linux deb/rpm/AppImage/Flatpak)

on:
  push:
    tags:
      - 'v*' # Trigger on version tags like v0.0.1-beta, v1.0.0

permissions:
  contents: write

jobs:
  release_windows:
    name: Windows (MSI + EXE)
    runs-on: windows-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Download and inject libmpv-2.dll
      shell: pwsh
      run: |
        New-Item -ItemType Directory -Force -Path "desktop-app/appResources/windows/mpv"
        $headers = @{ "User-Agent" = "CloudStream-Desktop-CI" }
        $rel = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/shinchiro/mpv-winbuild-cmake/releases/latest"
        $asset = $rel.assets | Where-Object { $_.name -like "mpv-dev-x86_64-*.7z" -and $_.name -notlike "*x86_64-v3*" } | Select-Object -First 1
        if (-not $asset) { throw "No mpv-dev-x86_64 asset found in release $($rel.tag_name)" }
        Write-Host "Downloading $($asset.name) ..."
        Invoke-WebRequest -Headers $headers -Uri $asset.browser_download_url -OutFile "mpv-dev.7z"
        7z e mpv-dev.7z "libmpv-2.dll" -o"desktop-app/appResources/windows/mpv" -r

    - name: Build MSI + single-file EXE (jpackage)
      shell: pwsh
      run: |
        # packageReleaseMsi  -> CloudStream-Desktop.msi
        # packageReleaseExe  -> single self-contained CloudStream-Desktop.exe
        #                       (jpackage --type exe bundles a JRE: no Java install needed)
        ./gradlew desktop-app:packageReleaseMsi desktop-app:packageReleaseExe

    - name: Upload Windows MSI
      uses: actions/upload-artifact@v4
      with:
        name: windows-msi
        path: desktop-app/build/compose/binaries/main-release/msi/*.msi
        if-no-files-found: error

    - name: Upload Windows EXE
      uses: actions/upload-artifact@v4
      with:
        name: windows-exe
        path: desktop-app/build/compose/binaries/main-release/exe/*.exe
        if-no-files-found: error

  release_linux:
    name: Linux (deb / rpm / AppImage / Flatpak)
    runs-on: ubuntu-latest

    steps:
    - name: Checkout source
      uses: actions/checkout@v4
      with:
        submodules: recursive

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    # jpackage Linux targets need rpmbuild (.rpm), fpm/dpkg-deb (.deb), and appimagetool (.AppImage)
    - name: Install packaging tooling (rpmbuild + fpm + appimagetool)
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm ruby ruby-dev build-essential
        sudo gem install fpm --no-document
        sudo curl -sL https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage -o /usr/local/bin/appimagetool
        sudo chmod +x /usr/local/bin/appimagetool
        # appimagetool ships as an AppImage; run it via extraction (no FUSE on runners)
        echo "APPIMAGE_EXTRACT_AND_RUN=1" >> "$GITHUB_ENV"

    - name: Build Linux packages (jpackage)
      run: |
        ./gradlew desktop-app:packageReleaseAppImage
        ./gradlew desktop-app:packageReleaseRpm
        ./gradlew desktop-app:packageReleaseDeb

    # packageReleaseAppImage only emits the jpackage app-image directory; squash it into a
    # self-extracting .AppImage with appimagetool (installed above, runs via extraction).
    - name: Build .AppImage (appimagetool)
      run: |
        set -e
        APP_IMAGE_DIR=desktop-app/build/compose/binaries/main-release/app/CloudStream-Desktop
        OUT=desktop-app/build/compose/binaries/main-release/CloudStream-Desktop-0.0.2-beta.AppImage
        rm -rf AppDir
        mkdir -p AppDir/usr/share/icons/hicolor/256x256/apps
        cp -r "$APP_IMAGE_DIR" AppDir/CloudStream-Desktop
        cp desktop-app/src/main/resources/logo_ui.png AppDir/usr/share/icons/hicolor/256x256/apps/logo_ui.png
        cp desktop-app/src/main/resources/logo_ui.png AppDir/logo_ui.png
        cat > AppDir/CloudStream-Desktop.desktop <<'EOF'
        [Desktop Entry]
        Type=Application
        Name=CloudStream Desktop
        Comment=CloudStream Desktop Client
        Exec=CloudStream-Desktop/bin/CloudStream-Desktop
        Icon=logo_ui
        Categories=AudioVideo;Video;Player;
        Terminal=false
        X-AppImage-Version=0.0.2-beta
        EOF
        ARCH=x86_64 /usr/local/bin/appimagetool AppDir "$OUT"

    - name: Stage app-image for Flatpak (best-effort)
      continue-on-error: true
      run: |
        # Copy the jpackage app-image into the layout the flatpak manifest expects,
        # then archive it so the flatpak job can restore the exact same tree.
        mkdir -p flatpak/app
        cp -r desktop-app/build/compose/binaries/main-release/app/CloudStream-Desktop flatpak/app/CloudStream-Desktop
        tar -C flatpak -czf flatpak-app-image.tar.gz app

    - name: Upload app-image for Flatpak
      uses: actions/upload-artifact@v4
      with:
        name: flatpak-app-image
        path: flatpak-app-image.tar.gz
        if-no-files-found: warn

    - name: Upload Linux artifacts
      uses: actions/upload-artifact@v4
      with:
        name: linux-packages
        path: |
          desktop-app/build/compose/binaries/main-release/**/*.AppImage
          desktop-app/build/compose/binaries/main-release/**/*.rpm
          desktop-app/build/compose/binaries/main-release/**/*.deb
        if-no-files-found: warn

  # Flatpak must be built in the flathub-infra container (has flatpak + the runtime
  # pre-installed and is privileged, so `flatpak --system` deploys are allowed).
  release_flatpak:
    name: Flatpak
    runs-on: ubuntu-latest
    needs: [release_linux]
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:freedesktop-24.08
      options: --privileged
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download staged app-image
        uses: actions/download-artifact@v4
        with:
          name: flatpak-app-image

      - name: Restore app-image tree
        run: mkdir -p flatpak && tar -C flatpak -xzf flatpak-app-image.tar.gz

      - name: Build Flatpak bundle
        uses: flatpak/flatpak-github-actions/flatpak-builder@v6
        with:
          manifest-path: flatpak-manifest.json
          bundle: build/flatpak/CloudStream-Desktop-0.0.2-beta.flatpak
          cache: true

      - name: Upload Flatpak bundle
        uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: build/flatpak/*.flatpak
          if-no-files-found: error

  publish:
    name: Publish Release
    runs-on: ubuntu-latest
    needs: [release_windows, release_linux, release_flatpak]

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts

    - name: Publish to GitHub Releases
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifacts/windows-msi/*.msi
          artifacts/windows-exe/*.exe
          artifacts/linux-packages/**/*.AppImage
          artifacts/linux-packages/**/*.rpm
          artifacts/linux-packages/**/*.deb
          artifacts/flatpak-bundle/*.flatpak
        generate_release_notes: true
        make_latest: true